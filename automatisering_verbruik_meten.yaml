# Zendure Strategie - verbruik meten en bijleren
# Nodig: meet elk kwartier en leert het verbruiksprofiel (vult ook een leeg profiel).
# Toevoegen: Instellingen > Automatiseringen > Automatisering maken > Nieuwe
# automatisering > ⋮ > Bewerken in YAML, alles vervangen door dit bestand en opslaan.
alias: Zendure Strategie - verbruik meten en bijleren
description: Batterijstrategie versie 2026-11-16.1. Nodig. Meet elk kwartier de meterstanden (zonne-opbrengst, Zendure in en uit, afname en teruglevering van het net, uit sensor.strategie_bronnen), berekent één keer de verschillen, de zonne-opwek en het huisverbruik van dat kwartier en zet die in input_text.strategie_kwartiermeting (tijd;meterstanden;verschillen;zon;huis). Met het huisverbruik schuift het verbruiksprofiel (input_text.strategie_verbruiksprofiel_per_uur) voor dat uur een stukje richting de meting, met het leertempo uit input_number.strategie_profiel_leertempo (0 = niet leren); een leeg profiel (nieuwe installatie) wordt bij de eerste meting helemaal gevuld. Zonne-opwek per kwartier is minstens teruglevering + batterijlading - import - ontlading (vangt een trage of terugspringende zonne-opbrengstmeter op). Ontbreekt een meterstand, dan wordt het kwartier niet bijgewerkt en telt de volgende meting het hele tijdvak, tot een uur. Is de vorige meting meer dan een uur oud (Home Assistant lang uit, automatisering stilgevallen), dan krijgt de meting geen verschillen; de kosten van dat gat worden niet geschat en tellen niet mee in één kwartier of op de verkeerde dag, en de volgende meting begint weer vanaf de nieuwe stand. Verschillen, zon en huis worden afgerond op 6 decimalen. Bijleren gebeurt alleen als de vorige meting minder dan 20 minuten oud is. De optionele automatisering Werkelijke kosten bijhouden gebruikt deze meting. Springt een meterstand van de Zendure of de P1-meter meer dan 50 Wh terug of meer dan 10 kWh in één kwartier vooruit, dan telt dat kwartier niet mee (geen verschillen in de meting, niet bijleren) en begint de volgende meting weer vanaf de nieuwe stand. Bij de zonnemeter telt een terugsprong als 0 en een sprong van meer dan 10 kWh ook als 0; de zon volgt dan uit de netbalans en de rest van het kwartier blijft geldig.
triggers:
- minutes: /15
  trigger: time_pattern
actions:
- alias: Vorige meting en bronnen
  variables:
    oud: '{{ states(''input_text.strategie_kwartiermeting'') }}'
    bron_zon: '{{ state_attr(''sensor.strategie_bronnen'', ''zon_opbrengst'') or '''' }}'
    bron_afname: '{{ state_attr(''sensor.strategie_bronnen'', ''net_verbruik'') or '''' }}'
    bron_levering: '{{ state_attr(''sensor.strategie_bronnen'', ''net_teruglevering'') or '''' }}'
- variables:
    prev: '{% set p = oud.split('';'') %}{{ (p[1].split('','') | map(''float'', 0) | list) if (p | length) == 5 and (p[1].split('','') | length) == 5 else [] }}'
    prev_ts: '{% set p = oud.split('';'') %}{{ p[0] | int(0) if (p | length) == 5 else none }}'
    rd: '{% set f = {''Wh'': 0.001, ''kWh'': 1, ''MWh'': 1000} %}{% set ns = namespace(v=[]) %}{% for e in [bron_zon, ''sensor.zendure_2400_ac_energie_export'', ''sensor.zendure_2400_ac_energie_import'', bron_afname, bron_levering] %}{% set k = f.get(state_attr(e, ''unit_of_measurement'')) %}{% set ns.v = ns.v + [0 if (loop.first and (e | string) == '''') else (((states(e) | float) * k) if (k is not none and is_number(states(e))) else -1)] %}{% endfor %}{{ ns.v }}'
- variables:
    d: '{# Verschil per meterstand sinds de vorige meting, nooit negatief. De zonnemeter (index 0) hapert soms een paar Wh terug of springt na uitval: een sprong van meer dan 10 kWh telt daar als 0 (de zon volgt dan uit de netbalans), de rest van het kwartier blijft geldig. Afgerond op 6 decimalen: rekenruis zoals 9e-13 zou anders als tekst doorkomen #}{% set ns = namespace(v=[]) %}{% for i in range(5) %}{% set df = [rd[i] - (prev[i] if i < (prev | length) else rd[i]), 0] | max %}{% set ns.v = ns.v + [(0 if (i == 0 and df > 10) else df) | round(6)] %}{% endfor %}{{ ns.v }}'
    sprong: '{# Een meterstand van de Zendure of de P1-meter springt meer dan 50 Wh terug, of meer dan 10 kWh in één kwartier (40 kW, meer dan een huisaansluiting): kwartier niet meetellen. De zonnemeter telt hier niet mee (zie d) #}{% set ns = namespace(s=false) %}{% if (prev | length) == 5 %}{% for i in range(1, 5) %}{% if rd[i] < prev[i] - 0.05 or rd[i] - prev[i] > 10 %}{% set ns.s = true %}{% endif %}{% endfor %}{% endif %}{{ ns.s }}'
- variables:
    zon: '{{ ([d[0], d[4] + d[2] - d[3] - d[1]] | max) | round(6) }}'
- variables:
    huis: '{{ ([zon + d[3] - d[4] + d[1] - d[2], 0] | max) | round(6) }}'
- alias: 'Meterstanden ontbreken: kwartier overslaan'
  if:
  - condition: template
    value_template: '{{ (rd | min) < 0 }}'
  then:
  - stop: Een meterstand ontbreekt of heeft geen bruikbare eenheid
- alias: Meting van dit kwartier opslaan
  action: input_text.set_value
  target:
    entity_id: input_text.strategie_kwartiermeting
  data:
    value: '{{ now().timestamp() | int ~ '';'' ~ (rd | map(''round'', 3) | join('','')) ~ '';'' ~ ((d | map(''round'', 6) | join('','')) if ((prev | length) == 5 and not sprong and prev_ts is number and (now().timestamp() - prev_ts) < 3900) else '''') ~ '';'' ~ (zon | round(6)) ~ '';'' ~ (huis | round(6)) }}'
- alias: 'Meterstand gesprongen: melden'
  if:
  - condition: template
    value_template: '{{ sprong }}'
  then:
  - action: logbook.log
    data:
      name: Zendure Strategie meting
      message: 'Meterstand teruggesprongen of onwaarschijnlijk grote sprong (oud {{ prev | join('', '') }}, nieuw {{ rd | join('', '') }}): dit kwartier telt niet mee voor verbruiksprofiel en kosten'
- alias: Verbruiksprofiel nog leeg (nieuwe installatie) - alle uren vullen met het gemeten huisverbruik van dit kwartier
  if:
  - condition: template
    value_template: '{{ states(''input_text.strategie_verbruiksprofiel_per_uur'') in ['''', ''unknown''] and (prev | length) == 5 and not sprong and (prev_ts is number and (now().timestamp() - prev_ts) < 1200) }}'
  then:
  - action: input_text.set_value
    data:
      value: '{{ ([([huis * 4000, 10000] | min) | round(1)] * 24) | join('','') }}'
    target:
      entity_id: input_text.strategie_verbruiksprofiel_per_uur
- alias: Verbruiksprofiel bijleren met het gemeten huisverbruik van dit kwartier
  if:
  - condition: template
    value_template: '{% set prof = states(''input_text.strategie_verbruiksprofiel_per_uur'').split('','') %}{{ (prev | length) == 5 and not sprong and (prof | length) == 24 and is_number(states(''input_number.strategie_profiel_leertempo'')) and (states(''input_number.strategie_profiel_leertempo'') | float) > 0 and (prev_ts is number and (now().timestamp() - prev_ts) < 1200) }}'
  then:
  - action: input_text.set_value
    data:
      value: '{% set prof = states(''input_text.strategie_verbruiksprofiel_per_uur'').split('','') | map(''float'', 0) | list %}{% set w = [huis * 4000, 10000] | min %}{% set h = (now().timestamp() - 450) | timestamp_custom(''%H'') | int %}{% set r = states(''input_number.strategie_profiel_leertempo'') | float / 100 %}{% set aq = 1 - (1 - r) ** 0.25 %}{% set ns = namespace(o=[]) %}{% for i in range(24) %}{% set ns.o = ns.o + [(((1 - aq) * prof[i] + aq * w) | round(1)) if i == h else (prof[i] | round(1))] %}{% endfor %}{{ ns.o | join('','') }}'
    target:
      entity_id: input_text.strategie_verbruiksprofiel_per_uur
mode: single
